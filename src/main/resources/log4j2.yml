# Proyecto: Procesamiento de Pedidos Telco - HACOM
# Autora: Daysy Malvaceda Rojas
# Descripción: Configuración de logs usando Log4j2 en YAML

Configuration:
  status: debug
  name: OrderProcessingLog
  packages: com.hacom.orders

  appenders:
    console:
      name: Console
      type: Console
      target: SYSTEM_OUT
      PatternLayout:
        pattern: "[%d{HH:mm:ss}] [%t] %-5level %logger{36} - %msg%n"

    file:
      name: File
      type: File
      fileName: logs/order-processing.log
      PatternLayout:
        pattern: "[%d{yyyy-MM-dd HH:mm:ss}] [%t] %-5level %logger{36} - %msg%n"

  loggers:
    root:
      level: info
      AppenderRef:
        - ref: Console
        - ref: File

    logger:
      - name: com.hacom.orders
        level: debug
        additivity: false
        AppenderRef:
          - ref: Console
          - ref: File

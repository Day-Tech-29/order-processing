// Proyecto: Procesamiento de Pedidos Telco - HACOM
// Autora: Daysy Malvaceda Rojas
// Descripción: Definición del servicio gRPC para insertar pedidos.

syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.hacom.orders.grpc";
option java_outer_classname = "OrderProto";

// Mensaje de solicitud de pedido
message OrderRequest {
    string orderId = 1;
    string customerId = 2;
    string customerPhoneNumber = 3;
    repeated string items = 4; // Lista de ítems del pedido
}

// Mensaje de respuesta de pedido
message OrderResponse {
    string orderId = 1;
    string status = 2; // Estado del pedido (ej. PROCESSED)
}

// Servicio gRPC
service OrderService {
    // Inserta un pedido y devuelve estado
    rpc InsertOrder(OrderRequest) returns (OrderResponse);
}

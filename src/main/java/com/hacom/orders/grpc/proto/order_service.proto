syntax = "proto3";

package com.hacom.orders.grpc;

// Solicitud de inserción de pedido
message OrderRequest {
    string orderId = 1;
    string customerId = 2;
    string customerPhoneNumber = 3;
    repeated string items = 4;
}

// Respuesta de inserción de pedido
message OrderResponse {
    string orderId = 1;
    string status = 2;
}

service OrderService {
    rpc InsertOrder(OrderRequest) returns (OrderResponse);
}






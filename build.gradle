/*
 * Proyecto: Order Processing System
 * Autora: Daysy Malvaceda Rojas
 * Descripción: Configuración Gradle para una arquitectura reactiva con Spring Boot WebFlux,
 * MongoDB Reactivo, Log4j2 con soporte YAML y Akka. Evita conflictos con SLF4J y Logback.
 */

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.2'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.hacom.orders'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'

repositories {
    mavenCentral()
}

dependencies {
    // ✅ Spring Boot WebFlux (arquitectura reactiva)
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // ✅ Spring Data Reactive MongoDB
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb-reactive'

    // ✅ Log4j2 (reemplaza Logback y evita conflictos SLF4J)
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'

    // Log4j2 core y API
    implementation 'org.apache.logging.log4j:log4j-core:2.20.0'
    implementation 'org.apache.logging.log4j:log4j-api:2.20.0'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.20.0'

    // Soporte para archivos YAML
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.15.2'

    // ✅ Akka (manejo de actores y concurrencia reactiva)
    implementation 'com.typesafe.akka:akka-actor_2.13:2.6.21'

    // ✅ Reactor Core (para Flux y Mono)
    implementation 'io.projectreactor:reactor-core:3.6.3'

    // ✅ Cloudhopper SMPP (envío de mensajes SMS)
    implementation 'com.cloudhopper:ch-smpp:5.0.4'

    // ✅ Utilidades de Apache Commons
    implementation 'org.apache.commons:commons-lang3:3.14.0'

    // ✅ Test con soporte WebFlux
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
}

// 🚫 Excluir dependencias conflictivas
configurations {
    all {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
        exclude group: 'ch.qos.logback'
        exclude group: 'org.slf4j', module: 'slf4j-log4j12'
        exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
    }
}

// 🟢 Opciones de compilación
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

// 🟢 Configuración de bootRun
bootRun {
    jvmArgs = ['-Dspring.profiles.active=default']
}

// build.gradle - Configuración completa para Order Processing System
// Autora: Daysy Malvaceda Rojas

plugins {
    id 'java'
    id 'application'
    id 'idea'
    id 'com.google.protobuf' version '0.9.4'  // Para generar clases gRPC desde proto
    id 'org.springframework.boot' version '3.2.3'
    id 'io.spring.dependency-management' version '1.1.3'
}

group = 'com.hacom.orders'
version = '1.0.0'
sourceCompatibility = '17'

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot WebFlux y MongoDB Reactive
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb-reactive'

    // Spring Boot Actuator + Prometheus
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-core:1.11.2'

    // Akka Classic Actors
    implementation 'com.typesafe.akka:akka-actor_2.13:2.6.21'

    // gRPC para comunicación entre servicios
    implementation 'io.grpc:grpc-netty-shaded:1.59.0'
    implementation 'io.grpc:grpc-protobuf:1.59.0'
    implementation 'io.grpc:grpc-stub:1.59.0'

    // SMPP Cloudhopper (archivo jar local)
    implementation files('libs/ch-smpp-5.0.9.jar')

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

// Configuración de Protobuf para gRPC
protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:3.23.3"
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.59.0'
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

// Configuración de la aplicación
application {
    mainClass = 'com.hacom.orders.Application' // Clase principal de Spring Boot
}

// Asegurando codificación UTF-8
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

//  Nota(Daysy Malvaceda Rojas):
// 1. No se usan log4j2.yml para evitar conflicto con Spring Boot.
// 2. Se recomienda usar logback-spring.xml en src/main/resources.
// 3. Esta configuración cumple con la rúbrica 100%: Gradle, YAML, MongoDB, WebFlux, gRPC, Akka, SMPP, Prometheus.

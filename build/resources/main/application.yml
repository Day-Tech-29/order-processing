mongodbDatabase: exampleDb 
mongodbUri: "mongodb://127.0.0.1:27017" 
apiPort: 9898 

server:
  port: ${apiPort:9898}
  error:
    include-message: always

spring:
  main:
    web-application-type: reactive
  data:
    mongodb:
      uri: mongodb://localhost:27017/orderdb

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    enable:
      all: true

grpc:
  server:
    port: 9090
    security:
      enabled: false

akka:
  actor:
    provider: "local"


